pipeline:
  dataset_dir: "Dataset"
  puzzles_subfolder: "Puzzles"
  merged_subfolder: "Train"
  games_subfolder: "Games"
  state_file: "pipeline_state.json"
  force_recompute: false
  log_level: "INFO"
  log_file: "Dataset/pipeline.log"
  step: null
  use_existing_games: false

engine:
  stockfish_path: "/usr/games/stockfish"
  threads: 1
  hash_mb: 32
  syzygy_path: null

raw_data:
  games_zst: "RawData/lichess_db_standard_rated_2020-01.pgn.zst"
  puzzles_zst: "RawData/lichess_db_puzzle.csv.zst"
  fics_pgn: "RawData/ficsgamesdb_201701_chess_movetimes_4339526.pgn"
  club_csv: ""

time_stats:
  output_filename: "avg_time_by_rating.json"
  max_games: 50000
  bucket_size: 100

games_pipeline:
  output_base_filename: "games.pt"
  max_games: 250000
  skip_games_part1: 0
  fics_max_games: 230000
  fics_skip_games: 0
  club_max_games: 200000
  club_skip_games: 0
  club_pgn_col: "pgn"
  mate_range_min: 1
  mate_range_max: 10
  search_depth: 8
  time_limit_seconds: 0.2
  max_piece_count: 18
  min_material_for_mate_attempt: 4
  only_decisive_games: true
  skip_time_forfeit: true
  ply_sample_step: 3
  min_ply: 8
  max_positions_per_game: 20
  require_clock: false
  drop_zero_clock: true
  workers: null
  checkpoint_every: 5000
  pool_join_timeout: 20.0
  min_rating: 1200
  max_rating: null
  min_material_diff_for_mate_attempt: 3
  require_heavy_piece: true
  skip_forced_moves: false
  dedupe_positions: true
  skip_trivial_endgame: true

puzzle_pipeline:
  decompressed_csv_filename: "lichess_puzzles.csv"
  chunk_size_bytes: 1048576
  max_puzzles: 100000

splits:
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2