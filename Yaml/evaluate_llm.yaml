holdout_dir: "Dataset/ExternalHoldout/holdout_clean"
out_dir: "Dataset/Test_LLM/metrics"
max_n: 10
# --- LLM (Google Gemma, endpoint compatibile OpenAI) ---
llm_enabled: true
llm_base_url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
llm_model: "gemma-4-26b-a4b-it"
llm_api_key_env: "GEMINI_API_KEY"
llm_temperature: 0.0
llm_max_tokens: 800
llm_timeout_seconds: 30
llm_max_retries: 3
llm_retry_backoff_seconds: 5.0
llm_request_delay_seconds: 2.0