evaluation:
  test_dir: "Dataset/Train/test_clean"      # cartella shardata, non più un file .pt
  checkpoint_basic: "Dataset/Train/checkpoints/basic_best.pt"
  checkpoint_time: "Dataset/Train/checkpoints/time_aware_best.pt"
  plots_dir: "Dataset/Test/plots"
  metrics_dir: "Dataset/Test/metrics"
  max_n: 5
  batch_size: 128
  num_workers: 2
  prefetch_factor: 4
  seed: 42
  use_amp: true

model_params:
  embedding_dims: 64
  gat_hidden_dim_event: 32
  gat_hidden_dim_embed: 128
  gat_hidden_dim_concat: 128
  num_heads: 4
  num_layers: 3
  dropout: 0.0
  use_batch_norm: false
  activation: "elu"
  norm_kind: "layer_norm"   # deve combaciare col norm_kind usato in training
  lambda_decay: 0.01