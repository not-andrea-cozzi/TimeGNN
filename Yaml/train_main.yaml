pipeline:
  dataset_dir: "Dataset"
  shards_subfolder: "Train/shards"
  checkpoints_subfolder: "Train/checkpoints"
  state_file: "train_pipeline_state.json"
  force_recompute: false
  log_level: "INFO"
  log_file: "Dataset/train_pipeline.log"
  step: null               # valori: "train_basic", "train_time_aware", "evaluate"
  no_amp: false

train_basic:
  enabled: true
  shards_dir: "Dataset/Train/shards"
  checkpoint: "Dataset/Train/checkpoints/basic"
  epochs: 50
  batch_size: 128
  num_workers: 1
  prefetch_factor: 4
  lr: 1.0e-3
  seed: 42
  patience: 5
  embedding_dims: 64
  gat_hidden_dim_event: 32
  gat_hidden_dim_embed: 128
  gat_hidden_dim_concat: 128
  num_heads: 4
  num_layers: 1
  dropout: 0.2
  use_batch_norm: true
  activation: "elu"
  weight_decay: 1.0e-4

train_time_aware:
  enabled: true
  shards_dir: "Dataset/Train/shards"
  checkpoint: "Dataset/Train/checkpoints/time_aware"
  epochs: 50
  batch_size: 128
  num_workers: 1
  prefetch_factor: 4
  lr: 1.0e-3
  seed: 42
  patience: 5
  embedding_dims: 64
  gat_hidden_dim_event: 32
  gat_hidden_dim_embed: 128
  gat_hidden_dim_concat: 128
  num_heads: 4
  num_layers: 1
  dropout: 0.2
  use_batch_norm: true
  activation: "elu"
  lambda_decay: 0.01
  weight_decay: 1.0e-4

evaluate:
  enabled: true
  test_data: "Dataset/Test/test_clean.pt"
  plots_dir: "Dataset/Test/plots"
  out_dir: "Dataset/Test/metrics"
  max_n: 10
  batch_size: 128
  num_workers: 2
  prefetch_factor: 4
  model_basic_checkpoint: "Dataset/Train/checkpoints/basic_best.pt"
  model_time_aware_checkpoint: "Dataset/Train/checkpoints/time_aware_best.pt"